<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <!-- Instant redirection via HTML meta tag -->
    <meta http-equiv="refresh" content="0;url=https://youtu.be/rviE88vKHkU">
</head>
<body>
    <p>If you are not redirected automatically, please <a href="https://youtu.be/rviE88vKHkU">click here</a>.</p>

    <!-- Fallback redirection via JavaScript -->
    <script>
        window.location.href = "https://youtu.be/rviE88vKHkU";
    </script>
</body>
</html>
